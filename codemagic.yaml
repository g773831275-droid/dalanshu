# ============================================================================
# Codemagic CI/CD 配置 —— 大蓝岛 (dalanbook_app) iOS 上架
# ----------------------------------------------------------------------------
# 项目: dalanshu (develop 分支)
# App : 大蓝岛
# Bundle ID: com.kaitengguan.dalandao
# Team ID: 5QLTMB4JGC
# Flutter 工程位于子目录 flutter-app/
#
# 上架前必须完成的准备（详见对话回复）:
#   1. 在 App Store Connect 创建 App（Bundle ID: com.kaitengguan.dalandao）
#   2. 创建 App Store Connect API Key（App Manager 或 Admin 权限）
#   3. 在 Codemagic 后台创建环境变量组 appstore_credentials，添加：
#        - APP_STORE_CONNECT_ISSUER_ID
#        - APP_STORE_CONNECT_KEY_IDENTIFIER
#        - APP_STORE_CONNECT_PRIVATE_KEY  (.p8 文件原始内容，含头尾)
# ============================================================================

workflows:
  ios-release:
    name: 大蓝岛 iOS 上架
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 引用 Codemagic UI 里配的 Developer Portal integration(名称: 大蓝海)
    integrations:
      app_store_connect: 大蓝海

    # ---------------- 触发条件 ----------------
    # push 到 develop 分支自动触发；也支持手动触发
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
      cancel_previous_builds: true

    # ---------------- 环境 ----------------
    environment:
      # Flutter 版本对齐 pubspec 要求的 sdk: ^3.12.2
      flutter: stable
      xcode: latest
      cocoapods: default
      # 凭证变量组（在 Codemagic 后台 → Teams → Environment variables 创建）
      groups:
        - appstore_credentials
      # appstore_credentials 组里的变量直接可用,无需在此重复声明:
      #   APP_STORE_CONNECT_ISSUER_ID / KEY_IDENTIFIER / PRIVATE_KEY
      # iOS 自动签名: 按 Reference name 引用 Codemagic 后台 Code signing identities 已上传的文件
      # (证书 p12 + 描述文件 profile 的 Reference name 都叫 dalandao)
      # 注意: 用 reference names 就不能再用 distribution_type + bundle_identifier (文档明确互斥)
      ios_signing:
        provisioning_profiles:
          - dalandao
        certificates:
          - dalandao

    # ---------------- 缓存 ----------------
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    # ---------------- 构建脚本 ----------------
    scripts:
      - name: 切到 Flutter 工程目录并校验版本
        working_directory: flutter-app
        script: |
          set -e
          echo "Flutter 版本:"
          flutter --version
          echo "Dart 版本:"
          dart --version

      - name: 拉取依赖
        working_directory: flutter-app
        script: |
          set -e
          flutter pub get

      - name: 生成 App 图标
        working_directory: flutter-app
        script: |
          set -e
          dart run flutter_launcher_icons

      - name: 静态分析
        working_directory: flutter-app
        script: |
          set -e
          flutter analyze || echo "⚠️ analyze 有警告，但继续构建"

      - name: 应用签名配置到 Xcode 项目
        working_directory: flutter-app
        script: |
          set -e
          # 把 ios_signing fetch 到的 provisioning profile 应用到 Xcode 项目
          xcode-project use-profiles

      - name: 构建 IPA (release)
        working_directory: flutter-app
        script: |
          set -e
          # 禁用 Swift Package Manager(项目无 xcworkspace, SPM 会报 "Xcode workspace not found")
          # 注意: Flutter 未来版本会强制 SPM,届时需改用 pod install 生成 workspace
          flutter config --no-enable-swift-package-manager
          # build_number 用 git 提交计数,保证每次上传递增(不依赖平台变量)
          # build_name 对齐 pubspec 的 1.0.1
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "本次构建 build_number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    # ---------------- 产物 ----------------
    artifacts:
      - flutter-app/build/ios/ipa/*.ipa
      - flutter-app/build/ios/ipa/*.dSYM.zip

    # ---------------- 上架发布 ----------------
    publishing:
      # 邮件通知
      email:
        recipients:
          - g773831275@gmail.com
        notify:
          success: true
          failure: true

      # App Store Connect 上架
      # 用 UI 配置的 Developer Portal integration(大蓝海)认证, 无需环境变量组
      app_store_connect:
        auth: integration

        # 提交到 TestFlight（测试通过后再正式提交审核）
        submit_to_testflight: true

        # 同时提交到 App Store 审核
        # ⚠️ 暂时关闭: App Store 上架信息(截图/描述/隐私政策/分类/年龄分级)未准备好, 准备好后改回 true
        submit_to_app_store: false

        # 审核通过后自动发布到 App Store（MANUAL / AFTER_APPROVAL / SCHEDULED）
        # ⚠️ release_type 仅在 submit_to_app_store: true 时有效; 当前 false 故注释, 改回 true 时一并启用
        # release_type: AFTER_APPROVAL

# ============================================================================
# 备注
# ----------------------------------------------------------------------------
# 1. 如果只想先 TestFlight 不直接审核，把 submit_to_app_store 改成 false
# 2. $BUILD_NUMBER 是 Codemagic 自动生成的递增数字；也可手动改 --build-number
# 3. 如遇 "bundle id already exists" 报错，请先到 developer.apple.com 注册
#    Bundle ID com.kaitengguan.dalandao 并关联到 App Store Connect 的 App
# 4. yaml 必须放在仓库根目录；Codemagic 会自动识别
# ============================================================================
