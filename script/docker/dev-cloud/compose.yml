services:
  backend:
    image: m.daocloud.io/docker.io/library/eclipse-temurin:17-jre-jammy
    container_name: dalanshu-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/dalanshu/app.env
      - /etc/dalanshu/properties/database.properties
      - /etc/dalanshu/properties/mail.properties
      - /etc/dalanshu/properties/tos.properties
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8080
      DALANSHU_DB_URL: jdbc:mysql://172.31.10.95:3306/dalanshu_dev?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      DALANSHU_DB_USERNAME: dalanshu_dev_app
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
    volumes:
      - ./current/backend/dalanshu-backend.jar:/app/app.jar:ro
      - ./logs/backend:/app/logs
      - ./temp:/app/temp
      - ./temp:/ruoyi/server/temp
      - /etc/dalanshu/properties:/root/.config/dalanshu:ro
    working_dir: /app
    command:
      - java
      - -XX:MaxRAMPercentage=60
      - -XX:+HeapDumpOnOutOfMemoryError
      - -Djava.io.tmpdir=/app/temp
      - -jar
      - /app/app.jar

  web:
    image: m.daocloud.io/docker.io/library/node:24-alpine
    container_name: dalanshu-web
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NITRO_HOST: 127.0.0.1
      NITRO_PORT: 3000
    volumes:
      - ./current/web/.output:/app/.output:ro
    working_dir: /app
    command: ["node", ".output/server/index.mjs"]

  nginx:
    image: docker.xuanyuan.me/library/nginx:1.27-alpine
    container_name: dalanshu-nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./current/admin/dist:/usr/share/nginx/admin:ro
